name: Mirror cdxgen Container Images

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated tags to mirror instead of the default selection (e.g. 13.0.0 or 13.0.0,v13,latest)'
        required: false
        type: string
        default: ''
      rolling_majors:
        description: 'Major series whose rolling tags (v13, v13.0, ...) are always mirrored'
        required: false
        type: string
        default: 'v12,v13'
      mirror_master:
        description: 'Also mirror the master tag'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'List what would be copied without copying it'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_names: ${{ steps.discover.outputs.image_names }}
      image_count: ${{ steps.discover.outputs.image_count }}
    steps:
      - name: Discover cdxgen* container images
        id: discover
        env:
          SOURCE_ORG: cdxgen
          IMAGE_NAME_PATTERN: ^cdxgen
          MAX_PAGES: 20
        run: |
          set -euo pipefail

          images_file="$(mktemp)"
          trap 'rm -f "${images_file}"' EXIT

          for page in $(seq 1 "${MAX_PAGES}"); do
            url="https://github.com/orgs/${SOURCE_ORG}/packages?ecosystem=container&page=${page}"
            echo "Discovering container packages from ${url}"

            html="$(curl -fsSL --retry 3 --retry-delay 2 "${url}")"
            page_names="$(printf '%s' "${html}" \
              | grep -Eo "/orgs/${SOURCE_ORG}/packages/container/package/[^\"?#< ]+" \
              | sed 's#.*/package/##' \
              | sort -u || true)"

            if [ -z "${page_names}" ]; then
              echo "No package links found on page ${page}; stopping discovery."
              break
            fi

            printf '%s\n' "${page_names}" | grep -E "${IMAGE_NAME_PATTERN}" >> "${images_file}" || true
          done

          if [ ! -s "${images_file}" ]; then
            echo "No cdxgen* container packages were discovered." >&2
            exit 1
          fi

          mapfile -t image_names < <(sort -u "${images_file}")
          image_json="$(printf '%s\n' "${image_names[@]}" \
            | python3 -c 'import json, sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"

          echo "Discovered ${#image_names[@]} image(s):"
          printf '  - %s\n' "${image_names[@]}"

          echo "image_names=${image_json}" >> "${GITHUB_OUTPUT}"
          echo "image_count=${#image_names[@]}" >> "${GITHUB_OUTPUT}"
        shell: bash

  mirror-images:
    needs: discover-images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        image-name: ${{ fromJson(needs.discover-images.outputs.image_names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image tags
        env:
          SOURCE_ORG: cdxgen
          DEST_ORG: cyclonedx
          IMAGE_NAME: ${{ matrix.image-name }}
          INPUT_VERSIONS: ${{ github.event.inputs.versions || '' }}
          ROLLING_MAJORS: ${{ github.event.inputs.rolling_majors || 'v12,v13' }}
          MIRROR_MASTER: ${{ github.event.inputs.mirror_master || 'true' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          SOURCE_IMAGE="ghcr.io/${SOURCE_ORG}/${IMAGE_NAME}"
          DEST_IMAGE="ghcr.io/${DEST_ORG}/${IMAGE_NAME}"

          echo "Source:      ${SOURCE_IMAGE}"
          echo "Destination: ${DEST_IMAGE}"

          if ! TAGS_JSON="$(skopeo list-tags "docker://${SOURCE_IMAGE}" 2>/dev/null)"; then
            echo "Could not list tags for ${SOURCE_IMAGE}; skipping."
            exit 0
          fi

          mapfile -t SELECTED_TAGS < <(
            printf '%s' "${TAGS_JSON}" \
              | jq -r '.Tags[]' \
              | ./scripts/select-tags.sh
          )

          if [ "${#SELECTED_TAGS[@]}" -eq 0 ]; then
            echo "No mirrorable tags for ${SOURCE_IMAGE}; skipping."
            exit 0
          fi

          echo "Mirroring ${#SELECTED_TAGS[@]} tag(s): ${SELECTED_TAGS[*]}"

          {
            echo "### ${IMAGE_NAME}"
            echo
            echo "| tag | result |"
            echo "| --- | ------ |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # A failed copy must not abort the remaining tags: one unreachable
          # tag should not strand the rest of the image, and the summary is
          # what makes a partial mirror visible afterwards.
          failed=0
          for TAG in "${SELECTED_TAGS[@]}"; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "| \`${TAG}\` | would copy |" >> "${GITHUB_STEP_SUMMARY}"
              echo "DRY RUN: would copy ${SOURCE_IMAGE}:${TAG}"
              continue
            fi
            echo "Copying ${SOURCE_IMAGE}:${TAG} -> ${DEST_IMAGE}:${TAG}"
            if skopeo copy \
              --multi-arch all \
              --retry-times 3 \
              "docker://${SOURCE_IMAGE}:${TAG}" \
              "docker://${DEST_IMAGE}:${TAG}"; then
              echo "| \`${TAG}\` | copied |" >> "${GITHUB_STEP_SUMMARY}"
            else
              failed=$((failed + 1))
              echo "| \`${TAG}\` | **failed** |" >> "${GITHUB_STEP_SUMMARY}"
              echo "Failed: ${DEST_IMAGE}:${TAG}"
            fi
          done

          echo >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failed}" -gt 0 ]; then
            echo "${failed} of ${#SELECTED_TAGS[@]} tag(s) failed to mirror for ${IMAGE_NAME}" >&2
            exit 1
          fi
        shell: bash
